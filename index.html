<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#f1efe8" />
    <meta
      name="description"
      content="一个轻量的函数图像绘制工具，可同时输入并比较两个函数。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fbfaf6'/%3E%3Cpath d='M10 34c8-24 16 24 24 0s12 0 20-9' fill='none' stroke='%23ee5b38' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>plot. · 函数图像</title>
    <script>
      try {
        if (window.localStorage.getItem("plot.theme.v1") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {
        // Color preference is optional.
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="plot. 首页">
          plot<span aria-hidden="true">.</span>
        </a>
        <div class="top-actions">
          <div class="edition" aria-label="版本 alpha 03">
            <span class="edition-dot" aria-hidden="true"></span>
            alpha 03
          </div>
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="进入护眼模式"
            aria-pressed="false"
            title="护眼模式"
          >
            <svg
              class="icon icon-moon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.9 13.1A8.5 8.5 0 0 1 10.9 3.1 8.5 8.5 0 1 0 20.9 13.1Z" />
            </svg>
            <svg
              class="icon icon-sun"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.42 1.42" />
              <path d="m17.65 17.65 1.42 1.42" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.35 17.65-1.42 1.42" />
              <path d="m19.07 4.93-1.42 1.42" />
            </svg>
          </button>
        </div>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <h1 id="composer-title" class="visually-hidden">函数图像绘制</h1>

        <div class="function-fields" id="function-fields">
          <div class="formula-row" id="formula-row-1" data-slot="0">
            <span class="series-swatch" aria-hidden="true"></span>
            <span class="formula-prefix" aria-hidden="true">y<sub>1</sub> =</span>
            <label class="visually-hidden" for="expression-1">第一个函数表达式</label>
            <input
              id="expression-1"
              class="expression-input"
              type="text"
              value="sin(x)"
              placeholder="sin(x)"
              inputmode="text"
              enterkeyhint="done"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              aria-describedby="expression-error"
            />
          </div>

          <div class="formula-row" id="formula-row-2" data-slot="1">
            <span class="series-swatch" aria-hidden="true"></span>
            <span class="formula-prefix" aria-hidden="true">y<sub>2</sub> =</span>
            <label class="visually-hidden" for="expression-2">第二个函数表达式</label>
            <input
              id="expression-2"
              class="expression-input"
              type="text"
              value="cos(x)"
              placeholder="cos(x)"
              inputmode="text"
              enterkeyhint="done"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              aria-describedby="expression-error"
            />
          </div>
        </div>

        <p class="expression-error" id="expression-error" role="status" aria-live="polite"></p>

        <div class="composer-footer">
          <div class="examples" aria-label="函数示例">
            <span class="examples-label">示例</span>
            <button class="example-chip" type="button" data-expression="sin(x)">sin(x)</button>
            <button class="example-chip" type="button" data-expression="x^2">x^2</button>
            <button class="example-chip" type="button" data-expression="1/x">1/x</button>
            <button class="example-chip" type="button" data-expression="sqrt(x)">sqrt(x)</button>
          </div>

          <button
            class="plot-button"
            id="plot-button"
            type="button"
            aria-label="绘制图像"
            title="绘制图像"
          >
            <span class="plot-button-label">绘制</span>
            <svg
              class="icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </div>
      </section>

      <section class="plot-panel" aria-label="函数图像画布">
        <canvas id="plot-canvas" aria-label="函数曲线图">
          当前浏览器不支持 Canvas。
        </canvas>

        <div class="plot-legend" aria-live="polite">
          <div class="legend-item" id="legend-item-1">
            <span class="legend-line" aria-hidden="true"></span>
            <span id="legend-expression-1">y₁ = sin(x)</span>
          </div>
          <div class="legend-item" id="legend-item-2">
            <span class="legend-line" aria-hidden="true"></span>
            <span id="legend-expression-2">y₂ = cos(x)</span>
          </div>
          <div class="legend-item legend-intersection" id="intersection-legend" hidden>
            <span class="intersection-key" aria-hidden="true"></span>
            <span id="intersection-summary">无交点</span>
          </div>
        </div>

        <div class="plot-controls" role="group" aria-label="画布控制">
          <button class="icon-button" id="zoom-in" type="button" aria-label="放大" title="放大">
            <svg
              class="icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
          <button class="icon-button" id="zoom-out" type="button" aria-label="缩小" title="缩小">
            <svg
              class="icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
            </svg>
          </button>
          <button class="icon-button" id="reset-view" type="button" aria-label="恢复视图" title="恢复视图">
            <svg
              class="icon"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="./expression.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
